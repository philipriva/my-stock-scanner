name: Daily Stock Scanner

on:
  schedule:
    # Primary: Mon–Fri 21:00 UTC ≈ after US cash close (EDT 16:00=20:00 UTC).
    # Scan runtime ~15m; GitHub schedule often starts 1–5h late — earlier cron
    # maximizes chance list+meta land before ExtraScan QQscan 10:00 JST / Sheet 11:00 JST.
    # Does NOT guarantee 11:00 under extreme Actions delay.
    - cron: "0 21 * * 1-5"
    # Backup: Tue–Sat 00:00 UTC ≈ 09:00 JST (catches primary skip / late Yahoo).
    - cron: "0 0 * * 2-6"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run Strong_Stocks scan
        id: scan
        run: |
          set +e
          python scan.py
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
      - name: Publish list + sidecar metadata
        id: publish
        run: |
          set -euo pipefail
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          echo "pushed=false" >> "$GITHUB_OUTPUT"
          echo "file=" >> "$GITHUB_OUTPUT"
          echo "meta=" >> "$GITHUB_OUTPUT"
          if ls Strong_Stocks_V3_*.txt 1> /dev/null 2>&1; then
            git add Strong_Stocks_V3_*.txt Strong_Stocks_V3_*.txt.meta.json || true
            if git diff --staged --quiet; then
              LATEST=$(ls -1 Strong_Stocks_V3_*.txt | sort | tail -1)
              echo "file=$LATEST" >> "$GITHUB_OUTPUT"
              META="${LATEST}.meta.json"
              if [ -f "$META" ]; then echo "meta=$META" >> "$GITHUB_OUTPUT"; fi
              echo "Strong_Stocks already committed; nothing new to push."
            else
              git commit -m "更新今日強勢股清單 + session metadata (V3)"
              git push
              LATEST=$(ls -1 Strong_Stocks_V3_*.txt | sort | tail -1)
              echo "file=$LATEST" >> "$GITHUB_OUTPUT"
              META="${LATEST}.meta.json"
              if [ -f "$META" ]; then echo "meta=$META" >> "$GITHUB_OUTPUT"; fi
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              echo "Published $LATEST (+ meta if present)"
            fi
          else
            echo "No Strong_Stocks txt produced."
          fi
      - name: Upload verify artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strong-scan-out
          path: |
            Strong_Stocks_V3_*.txt
            Strong_Stocks_V3_*.txt.meta.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Trigger ExtraScan QQscan
        if: steps.publish.outputs.pushed == 'true'
        env:
          EXTRASCAN_DISPATCH_TOKEN: ${{ secrets.EXTRASCAN_DISPATCH_TOKEN }}
          STRONG_FILE: ${{ steps.publish.outputs.file }}
          DID_PUSH: ${{ steps.publish.outputs.pushed }}
        run: |
          set -euo pipefail
          if [ -z "${EXTRASCAN_DISPATCH_TOKEN:-}" ]; then
            echo "::warning::EXTRASCAN_DISPATCH_TOKEN not set — ExtraScan relies on crons / SheetOps backup."
            exit 0
          fi
          BODY=$(jq -n --arg f "$STRONG_FILE" --argjson p true \
            '{event_type:"strong-stocks-updated",client_payload:{file:$f,pushed:$p,has_meta:true}}')
          HTTP=$(curl -sS -o /tmp/dispatch_body.txt -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${EXTRASCAN_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/philipriva/ExtraScan/dispatches \
            -d "$BODY")
          echo "repository_dispatch HTTP $HTTP"
          cat /tmp/dispatch_body.txt || true
          if [ "$HTTP" != "204" ]; then
            echo "::error::ExtraScan repository_dispatch failed (HTTP $HTTP)"
            exit 1
          fi
