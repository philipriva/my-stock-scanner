name: Daily Stock Scanner

on:
  schedule:
    # 夏令時間：台灣/香港早上 07:00 執行
    - cron: '0 23 * * *'
  workflow_dispatch: # 允許隨時手動點擊按鈕執行

# 💡 新增這兩行：強制 GitHub Actions 提前採用 Node.js 24 執行環境，徹底消除警告！
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 顯式允許機器人寫入專案內容

    steps:
    - name: 檢查程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝必要套件
      run: |
        pip install -r requirements.txt

    - name: 執行強勢股掃描
      run: |
        python scan.py

    - name: 自動將結果存回 GitHub 專案
      id: publish
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        echo "pushed=false" >> "$GITHUB_OUTPUT"
        echo "file=" >> "$GITHUB_OUTPUT"

        if ls Strong_Stocks_V3_*.txt 1> /dev/null 2>&1; then
          git add Strong_Stocks_V3_*.txt
          if git diff --staged --quiet; then
            echo "Strong_Stocks txt already committed; nothing new to push."
            LATEST=$(ls -1 Strong_Stocks_V3_*.txt | sort | tail -1)
            echo "file=$LATEST" >> "$GITHUB_OUTPUT"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "更新今日強勢股清單 (V3 高速版)"
            git push
            LATEST=$(ls -1 Strong_Stocks_V3_*.txt | sort | tail -1)
            echo "file=$LATEST" >> "$GITHUB_OUTPUT"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "Published $LATEST"
          fi
        else
          echo "今日未偵測到符合條件的強勢股，跳過上傳。"
        fi

    # Cross-repo: tell ExtraScan QQscan to pull newest Strong_Stocks (+ Maggie) into Sheet.
    # Requires Actions secret EXTRASCAN_DISPATCH_TOKEN on this repo (fine-grained PAT on
    # philipriva/ExtraScan with Contents: Read — required for repository_dispatch).
    # Without it, ExtraScan relies on its own crons only.
    - name: Trigger ExtraScan QQscan
      if: always() && steps.publish.outcome == 'success' && steps.publish.outputs.file != ''
      env:
        EXTRASCAN_DISPATCH_TOKEN: ${{ secrets.EXTRASCAN_DISPATCH_TOKEN }}
        STRONG_FILE: ${{ steps.publish.outputs.file }}
        DID_PUSH: ${{ steps.publish.outputs.pushed }}
      run: |
        set -euo pipefail
        if [ -z "${EXTRASCAN_DISPATCH_TOKEN:-}" ]; then
          echo "::warning::EXTRASCAN_DISPATCH_TOKEN not set on my-stock-scanner — ExtraScan QQscan relies on its own crons only. Add a fine-grained PAT (ExtraScan Contents: Read) as that secret."
          exit 0
        fi
        echo "Dispatching ExtraScan QQscan (file=$STRONG_FILE pushed=$DID_PUSH)…"
        BODY=$(jq -n --arg f "$STRONG_FILE" --argjson p "${DID_PUSH:-false}" \
          '{event_type:"strong-stocks-updated",client_payload:{file:$f,pushed:$p}}')
        HTTP=$(curl -sS -o /tmp/dispatch_body.txt -w "%{http_code}" -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${EXTRASCAN_DISPATCH_TOKEN}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/philipriva/ExtraScan/dispatches \
          -d "$BODY")
        echo "repository_dispatch HTTP $HTTP"
        cat /tmp/dispatch_body.txt || true
        if [ "$HTTP" != "204" ]; then
          echo "::error::ExtraScan repository_dispatch failed (HTTP $HTTP). Check EXTRASCAN_DISPATCH_TOKEN scopes (needs access to ExtraScan)."
          exit 1
        fi
        echo "ExtraScan QQscan dispatch accepted."
