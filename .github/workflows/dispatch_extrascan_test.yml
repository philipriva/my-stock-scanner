name: Dispatch ExtraScan QQscan (test)

# Manual-only: proves EXTRASCAN_DISPATCH_TOKEN can fire ExtraScan
# repository_dispatch (event_type strong-stocks-updated). Production
# path is the same curl inside Daily Stock Scanner after a new Strong push.
on:
  workflow_dispatch:
    inputs:
      file:
        description: "Optional client_payload.file (e.g. Strong_Stocks_V3_YYYYMMDD.txt)"
        required: false
        default: ""

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ExtraScan QQscan via secret
        env:
          EXTRASCAN_DISPATCH_TOKEN: ${{ secrets.EXTRASCAN_DISPATCH_TOKEN }}
          STRONG_FILE: ${{ inputs.file }}
        run: |
          set -euo pipefail
          if [ -z "${EXTRASCAN_DISPATCH_TOKEN:-}" ]; then
            echo "::error::EXTRASCAN_DISPATCH_TOKEN is empty — secret missing or not visible to Actions."
            exit 1
          fi
          FILE="${STRONG_FILE:-}"
          if [ -z "$FILE" ]; then
            FILE="test-manual-$(date -u +%Y%m%dT%H%M%SZ)"
          fi
          echo "Dispatching ExtraScan (file=$FILE)…"
          BODY=$(jq -n --arg f "$FILE" \
            '{event_type:"strong-stocks-updated",client_payload:{file:$f,pushed:true,source:"dispatch_extrascan_test"}}')
          HTTP=$(curl -sS -o /tmp/dispatch_body.txt -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${EXTRASCAN_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/philipriva/ExtraScan/dispatches \
            -d "$BODY")
          echo "repository_dispatch HTTP $HTTP"
          cat /tmp/dispatch_body.txt || true
          if [ "$HTTP" != "204" ]; then
            echo "::error::ExtraScan repository_dispatch failed (HTTP $HTTP). Check PAT scopes on ExtraScan."
            exit 1
          fi
          echo "ExtraScan QQscan dispatch accepted (HTTP 204)."
